<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>경일글로벌 입/출고 접수 키오스크</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
    }

    input, button {
      font-family: inherit;
    }

    input[type="radio"] {
      accent-color: #3b82f6;
    }

    /* 키오스크 터치 환경 */
    button,
    label {
      touch-action: manipulation;
      user-select: none;
    }

    .kiosk-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .kiosk-card {
      width: 100%;
      max-width: 720px;
    }

    .work-type-card {
      min-height: 88px;
    }

    .touch-input {
      min-height: 68px;
      font-size: 1.25rem;
    }

    .submit-button {
      min-height: 78px;
    }

    .modal-button {
      min-height: 64px;
    }

    @media (max-width: 640px) {
      .kiosk-shell {
        padding: 10px;
        align-items: flex-start;
      }

      .kiosk-card {
        margin-top: 10px;
      }

      .kiosk-form {
        padding: 22px !important;
      }

      .header-area {
        padding: 24px 20px !important;
      }

      .touch-input {
        min-height: 62px;
        font-size: 1.1rem;
      }

      .work-type-card {
        min-height: 76px;
        padding: 12px !important;
      }

      .work-type-card span {
        font-size: 1rem !important;
      }

      .submit-button {
        min-height: 70px;
      }
    }
  </style>
</head>

<body>
  <main class="kiosk-shell">
    <section class="kiosk-card bg-slate-900 text-slate-100 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">

      <!-- Header -->
      <div class="header-area bg-slate-950 px-8 py-6 border-b border-slate-800 text-center">
        <div class="inline-flex items-center justify-center bg-white/10 p-3 rounded-2xl mb-3">
          <img
            src="logo.png"
            alt="경일글로벌 로고"
            class="h-10 w-auto object-contain"
            onerror="this.style.display='none'; document.getElementById('kiosk-fallback-icon').style.display='block';"
          >
          <i id="kiosk-fallback-icon" data-lucide="truck" class="w-8 h-8 text-blue-400 hidden"></i>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
          경일글로벌 입/출고 접수 키오스크
        </h1>

        <p class="text-slate-400 text-sm sm:text-base mt-2 mb-5">
          기사님 접수를 위해 아래 정보를 입력해 주세요.
        </p>

        <!-- Waiting count -->
        <div class="bg-slate-900 border border-blue-500/40 rounded-2xl p-4 max-w-sm mx-auto shadow-inner">
          <p class="text-xs sm:text-sm text-blue-400 font-bold mb-1">현재 대기순번</p>
          <p class="text-3xl sm:text-4xl font-black text-amber-400 tracking-tight">
            <span id="kiosk-header-queue-count">0</span>
            <span class="text-lg sm:text-xl text-slate-300 font-bold ml-1">번째</span>
          </p>
        </div>
      </div>

      <!-- Kiosk Form -->
      <form id="kiosk-form" class="kiosk-form p-8 space-y-6">

        <!-- Work type -->
        <div>
          <label class="block text-base font-bold text-slate-300 mb-3">
            상차/하차 구분 *
          </label>

          <div class="flex gap-4">
            <label class="work-type-card flex items-center justify-center gap-3 text-white bg-slate-800 border border-slate-600 px-4 py-4 rounded-2xl flex-1 cursor-pointer hover:border-blue-500 transition">
              <input
                type="radio"
                name="work-type"
                value="하차(입고)"
                required
                class="w-6 h-6"
              >
              <span class="font-bold text-lg">하차 (입고)</span>
            </label>

            <label class="work-type-card flex items-center justify-center gap-3 text-white bg-slate-800 border border-slate-600 px-4 py-4 rounded-2xl flex-1 cursor-pointer hover:border-amber-500 transition">
              <input
                type="radio"
                name="work-type"
                value="상차(출고)"
                required
                class="w-6 h-6"
              >
              <span class="font-bold text-lg">상차 (출고)</span>
            </label>
          </div>
        </div>

        <!-- Client -->
        <div>
          <label for="client-name" class="block text-base font-bold text-slate-300 mb-2">
            화주명 *
          </label>
          <input
            type="text"
            id="client-name"
            required
            autocomplete="organization"
            placeholder="EX. 거상"
            class="touch-input w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white font-semibold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          >
        </div>

        <!-- Car number -->
        <div>
          <label for="car-number" class="block text-base font-bold text-slate-300 mb-2">
            차량번호 *
          </label>
          <input
            type="text"
            id="car-number"
            required
            autocomplete="off"
            placeholder="EX. 부산00아0000"
            class="touch-input w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white font-semibold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          >
        </div>

        <!-- Phone -->
        <div>
          <label for="phone-number" class="block text-base font-bold text-slate-300 mb-2">
            전화번호 *
          </label>
          <input
            type="tel"
            id="phone-number"
            required
            maxlength="13"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="EX. 010-0000-0000"
            class="touch-input w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white font-semibold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          >
        </div>

        <!-- Quantity -->
        <div>
          <label for="quantity" class="block text-base font-bold text-slate-300 mb-2">
            수량 *
          </label>
          <input
            type="number"
            id="quantity"
            required
            min="1"
            step="1"
            inputmode="numeric"
            placeholder="수량을 입력하세요"
            class="touch-input w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white font-semibold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          >
        </div>

        <!-- Note / Cargo name -->
        <div>
          <label for="note" class="block text-base font-bold text-slate-300 mb-2">
            비고 (화물명)
          </label>
          <input
            type="text"
            id="note"
            autocomplete="off"
            placeholder="EX. 화물명"
            class="touch-input w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white font-semibold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          >
        </div>

        <!-- 담당자 -->
        <div>
          <label for="manager" class="block text-base font-bold text-slate-300 mb-2">
            담당자
          </label>
          <input
            type="text"
            id="manager"
            autocomplete="off"
            placeholder="모르시면 비워주세요."
            class="touch-input w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white font-semibold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          >
        </div>

        <!-- Submit -->
        <button
          id="submit-button"
          type="submit"
          class="submit-button w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xl sm:text-2xl font-bold rounded-2xl shadow-lg transition duration-200 flex items-center justify-center gap-3"
        >
          <i data-lucide="clipboard-check" class="w-6 h-6"></i>
          접수 완료하기
        </button>
      </form>
    </section>
  </main>

  <!-- Success Modal -->
  <div
    id="kiosk-success-modal"
    class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50"
  >
    <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-8 text-center space-y-5 shadow-2xl">

      <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="check-circle-2" class="w-12 h-12"></i>
      </div>

      <h2 class="text-2xl sm:text-3xl font-black text-white">
        접수가 완료되었습니다!
      </h2>

      <div class="bg-slate-900 border border-blue-500/30 rounded-2xl p-5 my-2">
        <p class="text-slate-400 text-sm mb-1">현재 기사님의 순번</p>
        <p class="text-4xl font-black text-amber-400">
          <span id="modal-queue-order-number">0</span>번째
        </p>
      </div>

      <p class="text-lg font-bold text-amber-400 leading-snug">
        차에서 대기해주세요. 빠른 시간내에 전화 드리겠습니다.
        <br>
        <span class="text-xs text-slate-400 font-normal">
          (위치는 전화로 알려드릴 예정입니다.)
        </span>
      </p>

      <button
        id="success-confirm-button"
        type="button"
        class="modal-button w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold rounded-xl text-lg transition cursor-pointer"
      >
        확인
      </button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgXG4dVextcvKD2vwsa11Y7zXPp8rbI08",
      authDomain: "kiglsystem.firebaseapp.com",
      databaseURL: "https://kiglsystem-default-rtdb.firebaseio.com",
      projectId: "kiglsystem",
      storageBucket: "kiglsystem.firebasestorage.app",
      messagingSenderId: "782535308238",
      appId: "1:782535308238:web:afab46d543d96648eb319f",
      measurementId: "G-TTV99051J8"
    };

    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();
    const dashboardRef = database.ref('dashboard_items');

    let autoCloseTimer = null;
    let currentWaitingCount = 0;
    let isSubmitting = false;

    lucide.createIcons();

    dashboardRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      recalculateWaitingCount(data);
    }, (error) => {
      console.error('Firebase 읽기 실패:', error);
      showFirebaseError();
    });

    function recalculateWaitingCount(data) {
      let waiting = 0;

      Object.values(data).forEach((item) => {
        if (item && item.status === 'WAITING') {
          waiting++;
        }
      });

      currentWaitingCount = waiting;

      const headerQueue = document.getElementById('kiosk-header-queue-count');

      if (headerQueue) {
        headerQueue.innerText = waiting;
      }
    }

    // ★ Make 웹훅을 통해 카카오톡 오픈채팅방(단톡방)으로 알림을 전송하는 함수 추가
    function sendMakeWebhookAlert(clientName, carNumber, workType, quantity, phoneNumber, note) {
      const webhookUrl = 'https://hook.eu1.make.com/awnbitgj4j87x37j6ld3iwskva4shco3';

      const payload = {
        workType: workType,
        clientName: clientName,
        carNumber: carNumber,
        phoneNumber: phoneNumber,
        quantity: quantity,
        note: note || '-'
      };

      fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.error("Make 웹훅 전송 실패:", err));
    }

    async function handleKioskSubmit(event) {
      event.preventDefault();

      if (isSubmitting) return;

      const workType =
        document.querySelector('input[name="work-type"]:checked')?.value ||
        '하차(입고)';

      const clientName =
        document.getElementById('client-name').value.trim();

      const carNumber =
        document.getElementById('car-number').value.trim();

      const phoneNumber =
        document.getElementById('phone-number').value.trim();

      const quantity =
        document.getElementById('quantity').value.trim();

      const note =
        document.getElementById('note').value.trim();

      const manager =
        document.getElementById('manager').value.trim();

      const form = document.getElementById('kiosk-form');

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (!clientName || !carNumber || !phoneNumber || !quantity) {
        alert('필수 정보를 모두 입력해주세요.');
        return;
      }

      const quantityNumber = Number(quantity);

      if (!Number.isInteger(quantityNumber) || quantityNumber < 1) {
        alert('수량은 1 이상의 정수로 입력해주세요.');
        document.getElementById('quantity').focus();
        return;
      }

      const now = new Date();

      const timeStr =
        `${String(now.getMonth() + 1).padStart(2, '0')}-` +
        `${String(now.getDate()).padStart(2, '0')} ` +
        `${String(now.getHours()).padStart(2, '0')}:` +
        `${String(now.getMinutes()).padStart(2, '0')}`;

      const submitButton = document.getElementById('submit-button');

      isSubmitting = true;

      submitButton.disabled = true;
      submitButton.classList.add('opacity-60', 'cursor-not-allowed');

      submitButton.innerHTML = `
        <i data-lucide="loader-circle" class="w-6 h-6 animate-spin"></i>
        접수 처리 중...
      `;
      lucide.createIcons();

      const queueOrderNumber = currentWaitingCount + 1;

      try {
        await dashboardRef.push({
          workType,
          timeStr,
          manager: manager || "미정",
          carNumber,
          phoneNumber,
          clientName,
          quantity: quantityNumber,
          note: note || "키오스크 신규 접수",
          status: "WAITING",
          worker: "",
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        // ★ Firebase 저장 성공 시 Make 웹훅(카카오톡 오픈채팅방 연동용) 전송 실행
        sendMakeWebhookAlert(clientName, carNumber, workType, quantityNumber, phoneNumber, note);

        document.getElementById('modal-queue-order-number').innerText =
          queueOrderNumber;

        const modal = document.getElementById('kiosk-success-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        if (autoCloseTimer) {
          clearTimeout(autoCloseTimer);
        }

        autoCloseTimer = setTimeout(() => {
          closeKioskSuccessModal();
        }, 10000);

      } catch (error) {
        console.error('접수 저장 실패:', error);
        alert('접수 저장 실패: ' + (error.message || '알 수 없는 오류'));
      } finally {
        isSubmitting = false;

        submitButton.disabled = false;
        submitButton.classList.remove('opacity-60', 'cursor-not-allowed');

        submitButton.innerHTML = `
          <i data-lucide="clipboard-check" class="w-6 h-6"></i>
          접수 완료하기
        `;
        lucide.createIcons();
      }
    }

    function closeKioskSuccessModal() {
      if (autoCloseTimer) {
        clearTimeout(autoCloseTimer);
        autoCloseTimer = null;
      }

      const modal = document.getElementById('kiosk-success-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');

      document.getElementById('kiosk-form').reset();
      document.activeElement?.blur();
    }

    function formatPhoneNumber(input) {
      let val = input.value.replace(/\D/g, '');
      let formatted = '';

      if (val.length < 4) {
        formatted = val;
      } else if (val.length < 8) {
        formatted =
          val.substring(0, 3) + '-' + val.substring(3);
      } else if (val.length < 11) {
        formatted =
          val.substring(0, 3) + '-' + val.substring(3, 7) + '-' + val.substring(7);
      } else {
        formatted =
          val.substring(0, 3) + '-' + val.substring(3, 7) + '-' + val.substring(7, 11);
      }

      input.value = formatted;
    }

    function showFirebaseError() {
      const queue = document.getElementById('kiosk-header-queue-count');
      if (queue) {
        queue.innerText = '-';
      }
    }

    document.getElementById('kiosk-form').addEventListener(
      'submit',
      handleKioskSubmit
    );

    document.getElementById('phone-number').addEventListener(
      'input',
      function () {
        formatPhoneNumber(this);
      }
    );

    document.getElementById('success-confirm-button').addEventListener(
      'click',
      closeKioskSuccessModal
    );

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('client-name')?.focus();
    });
  </script>
</body>
</html>
