<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경일글로벌 모바일 물류 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
    }
    @keyframes bounce-short {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-notification {
      animation: bounce-short 0.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16">

  <!-- 알림 권한 요청 및 안내 배너 (최초 접속 시 표시) -->
  <div id="notification-permission-banner" class="bg-blue-600 text-white px-4 py-2.5 text-xs font-bold text-center flex justify-between items-center shadow-inner hidden">
    <span>🔔 현장 알림 및 진동을 받으려면 알림 권한을 허용해주세요!</span>
    <button onclick="requestNotificationPermission()" class="bg-white text-blue-600 px-3 py-1 rounded-lg text-[11px] font-black cursor-pointer shadow">알림 허용하기</button>
  </div>

  <!-- 실시간 신규 접수 알림 팝업 배너 -->
  <div id="new-order-alert" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl z-50 hidden flex items-center gap-3 border border-blue-500/50">
    <i data-lucide="bell" class="w-6 h-6 text-amber-400 animate-bounce"></i>
    <div>
      <p class="text-xs font-black text-amber-400">새로운 기사님 접수!</p>
      <p id="new-order-text" class="text-xs font-medium text-slate-200 mt-0.5">확인해보세요.</p>
    </div>
  </div>

  <!-- Mobile Header -->
  <header class="bg-slate-900 text-white px-4 py-3.5 flex justify-between items-center shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-2.5">
      <img src="logo.png" alt="경일글로벌 로고" class="h-7 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('header-fallback-icon').style.display='flex';">
      <div id="header-fallback-icon" class="hidden bg-blue-600 text-white p-1.5 rounded-lg items-center justify-center">
        <i data-lucide="truck" class="w-4 h-4"></i>
      </div>
      <span class="text-sm font-black tracking-tight">경일글로벌 모바일</span>
    </div>
    
    <div class="flex items-center gap-1.5">
      <span id="sync-status-badge" class="text-[10px] bg-amber-500 text-white px-2 py-0.5 rounded-full font-bold">대기 중</span>
      <button onclick="openSettingsModal()" class="bg-slate-800 hover:bg-slate-700 text-white p-2 rounded-xl transition cursor-pointer" title="환경설정">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Tab Navigation -->
  <nav class="bg-white border-b border-slate-200 px-4 py-2 flex gap-2 sticky top-[57px] z-30 shadow-sm">
    <button id="nav-dashboard-tab" onclick="switchMobileTab('dashboard')" class="flex-1 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1.5 transition bg-blue-600 text-white shadow-sm">
      <i data-lucide="clipboard-list" class="w-4 h-4"></i>
      <span>오퍼레이터 대시보드</span>
      <span id="mobile-nav-badge" class="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-black">0</span>
    </button>
    <button id="nav-export-tab" onclick="switchMobileTab('export')" class="flex-1 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200">
      <i data-lucide="ship" class="w-4 h-4"></i>
      <span>수출 현황판</span>
    </button>
  </nav>

  <!-- TAB 1: Operator Dashboard (실시간 접수 현황) -->
  <main id="mobile-tab-dashboard" class="max-w-md mx-auto px-3 py-4 space-y-3 block">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <p class="text-[11px] font-bold text-slate-400">Firebase 실시간 연동</p>
        <h2 class="text-sm font-black text-slate-900">기사님 실시간 접수 목록</h2>
      </div>
      <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-xl">대기중: <span id="mobile-count-waiting">0</span>건</span>
    </div>

    <div id="mobile-dashboard-container" class="space-y-3">
      <div class="text-center py-12 text-slate-400 font-semibold bg-white rounded-2xl p-6 border border-slate-200">
        접수된 데이터가 없습니다.
      </div>
    </div>
  </main>

  <!-- TAB 2: Export Status Board (수출 현황판) -->
  <main id="mobile-tab-export" class="max-w-md mx-auto px-3 py-4 space-y-3 hidden">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <p class="text-[11px] font-bold text-slate-400">구글 시트 연동</p>
        <h2 class="text-sm font-black text-slate-900">수출작업 예정 카드 목록</h2>
      </div>
      <button onclick="fetchSheetData(localStorage.getItem('sheetWebAppUrl'))" class="bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 shadow cursor-pointer">
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> 새로고침
      </button>
    </div>

    <div id="mobile-export-container" class="space-y-3">
      <div class="text-center py-12 text-slate-400 font-semibold bg-white rounded-2xl p-6 border border-slate-200">
        우측 상단 톱니바퀴(⚙️) 설정에서 웹 앱 URL을 먼저 입력해주세요.
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-sm p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 text-base">모바일 환경설정</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">구글 Apps Script 웹 앱 URL</label>
        <input type="text" id="sheet-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-blue-500">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeSettingsModal()" class="px-3.5 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold cursor-pointer">취소</button>
        <button onclick="saveSettings()" class="px-3.5 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold cursor-pointer">저장 및 동기화</button>
      </div>
    </div>
  </div>

  <!-- 사진 목록 보기 모달창 -->
  <div id="photo-viewer-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="photo-modal-title" class="font-black text-slate-900 text-base">작업 사진 목록</h3>
        <button onclick="closePhotoModal()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="photo-modal-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-1"></div>
      <div class="flex justify-end pt-2 border-t">
        <button onclick="closePhotoModal()" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl text-xs cursor-pointer">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgXG4dVextcvKD2vwsa11Y7zXPp8rbI08",
      authDomain: "kiglsystem.firebaseapp.com",
      databaseURL: "https://kiglsystem-default-rtdb.firebaseio.com",
      projectId: "kiglsystem",
      storageBucket: "kiglsystem.firebasestorage.app",
      messagingSenderId: "782535308238",
      appId: "1:782535308238:web:afab46d543d96648eb319f",
      measurementId: "G-TTV99051J8"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dashboardRef = database.ref('dashboard_items');
    const exportPhotosRef = database.ref('export_photos');
    const exportStatusRef = database.ref('export_status');

    let dashboardMap = {};
    let exportPhotosMap = {};
    let exportStatusMap = {};
    let lastSheetRows = [];
    let lastRawDataString = "";
    let isInitialDashboardLoad = true;

    lucide.createIcons();

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            document.getElementById('notification-permission-banner').classList.add('hidden');
          }
        });
      }
    }

    dashboardRef.on('value', (snapshot) => {
      const newData = snapshot.val() || {};
      if (!isInitialDashboardLoad) {
        const oldKeys = Object.keys(dashboardMap);
        const newKeys = Object.keys(newData);
        if (newKeys.length > oldKeys.length) {
          const latestKey = newKeys[newKeys.length - 1];
          const latestItem = newData[latestKey];
          if (latestItem) {
            const msg = `[${latestItem.workType || '접수'}] 화주명: ${latestItem.clientName || '미정'} (${latestItem.carNumber || ''})`;
            showNewOrderAlert(msg);
            if ('vibrate' in navigator) navigator.vibrate([300, 150, 300, 150, 300]);
            if ('Notification' in window && Notification.permission === 'granted') {
              new Notification("경일글로벌 새 기사님 접수!", { body: msg, icon: "logo.png" });
            }
          }
        }
      }
      dashboardMap = newData;
      isInitialDashboardLoad = false;
      renderMobileDashboard(dashboardMap);
    });

    exportPhotosRef.on('value', (snapshot) => {
      exportPhotosMap = snapshot.val() || {};
      renderMobileDashboard(dashboardMap);
      if (lastSheetRows.length > 0) renderMobileExportCards(lastSheetRows);
    });

    exportStatusRef.on('value', (snapshot) => {
      exportStatusMap = snapshot.val() || {};
      if (lastSheetRows.length > 0) renderMobileExportCards(lastSheetRows);
    });

    function showNewOrderAlert(textMsg) {
      const alertBox = document.getElementById('new-order-alert');
      const textEl = document.getElementById('new-order-text');
      textEl.innerText = textMsg;
      alertBox.classList.remove('hidden');
      setTimeout(() => { alertBox.classList.add('hidden'); }, 5000);
    }

    function switchMobileTab(tabName) {
      localStorage.setItem('currentMobileTab', tabName);
      ['dashboard', 'export'].forEach(t => {
        document.getElementById(`mobile-tab-${t}`).className = (t === tabName) ? "max-w-md mx-auto px-3 py-4 space-y-3 block" : "hidden";
        const btn = document.getElementById(`nav-${t}-tab`);
        if (btn) {
          btn.className = (t === tabName) ? "flex-1 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1.5 transition bg-blue-600 text-white shadow-sm" : "flex-1 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1.5 transition bg-slate-100 text-slate-600 hover:bg-slate-200";
        }
      });
    }

    function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
    function saveSettings() {
      const url = document.getElementById('sheet-url-input').value.trim();
      if (!url) return;
      localStorage.setItem('sheetWebAppUrl', url);
      closeSettingsModal();
      fetchSheetData(url);
    }

    function fetchSheetData(webAppUrl) {
      if (!webAppUrl) return;
      const badge = document.getElementById('sync-status-badge');
      if (badge) {
        badge.className = "text-[10px] bg-amber-500 text-white px-2 py-0.5 rounded-full font-bold animate-pulse";
        badge.innerText = "동기화 중...";
      }
      const oldScript = document.getElementById('jsonp-script-loader');
      if (oldScript) oldScript.remove();

      window.onSheetDataReceived = function(data) {
        lastSheetRows = data || [];
        const newDataString = JSON.stringify(lastSheetRows);
        if (newDataString !== lastRawDataString) {
          lastRawDataString = newDataString;
          renderMobileExportCards(lastSheetRows);
        }
        if (badge) {
          badge.className = "text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-bold";
          badge.innerText = "연동 완료";
        }
      };

      const script = document.createElement('script');
      script.id = 'jsonp-script-loader';
      script.src = `${webAppUrl}${webAppUrl.includes('?') ? '&' : '?'}callback=onSheetDataReceived&_ts=${Date.now()}`;
      document.body.appendChild(script);
    }

    function updateDashboardField(key, field, val) { dashboardRef.child(key).update({ [field]: val }); }
    function updateDashboardStatus(key, val) { 
      dashboardRef.child(key).update({ status: val }); 
      // 즉시 UI 반영을 위해 리렌더링
      renderMobileDashboard(dashboardMap);
    }

    async function updateExportStatusOrWorker(element, colIndex, fieldName, rowIndex) {
      const webAppUrl = document.getElementById('sheet-url-input').value.trim();
      const value = element.value;
      exportStatusRef.child(`row_${rowIndex}_${fieldName}`).set(value);
      if (webAppUrl) {
        try {
          const formData = new URLSearchParams();
          formData.append('action', 'updateCell');
          formData.append('row', rowIndex);
          formData.append('col', colIndex);
          formData.append('value', value);
          await fetch(webAppUrl, { method: 'POST', body: formData });
        } catch (err) {
          console.error("시트 저장 에러:", err);
        }
      }
    }

    function cleanShoringText(rawText) {
      if (!rawText) return '-';
      let text = rawText.toString().trim();
      if (text.includes('T') && (text.includes('Z') || text.includes('+') || text.includes(':'))) return '-';
      return text;
    }

    const shoringPhoneMap = {
      "SH": "010-8377-8779",
      "로케트": "051-442-0058", "로켓트": "051-442-0058",
      "하람": "010-9419-2245", "더옥": "051-971-6949",
      "우영": "051-643-2333", "신성": "051-634-4353", "신성TLS": "051-634-4353",
      "동해": "051-464-8588", "카스": "051-463-9525", "하나": "051-753-3618",
      "대명": "051-637-4667", "SL": "010-8014-4276",
      "씨어코리아": "010-2515-4542", "씨어": "010-2515-4542", "세아": "010-2515-4542",
      "제이원": "010-9649-9399"
    };

    function getPhoneNumberByShoring(shoringText) {
      const clean = cleanShoringText(shoringText);
      if (clean === '-') return null;
      for (const [key, phone] of Object.entries(shoringPhoneMap)) {
        if (clean.toUpperCase().includes(key.toUpperCase())) return phone;
      }
      return null;
    }

    function resizeImage(file, maxWidth = 900, quality = 0.6) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl.split(',')[1]);
          };
        };
      });
    }

    async function handleMobilePhotoUpload(event, btnIndex, rowKeyOrIdx, identifier, isDashboard = false) {
      const inputEl = event.target;
      const files = Array.from(inputEl.files);
      if (files.length === 0) return;

      const webAppUrl = document.getElementById('sheet-url-input').value.trim();
      if (!webAppUrl) { inputEl.value = ''; return; }

      const card = inputEl.closest('.bg-white');
      let loadingBox = null;
      if (card) {
        loadingBox = document.createElement('div');
        loadingBox.className = "flex items-center gap-1.5 font-bold text-amber-800 bg-amber-100 px-3 py-2 rounded-xl border border-amber-300 text-xs mt-2";
        loadingBox.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span> [사진 ${btnIndex}] ${files.length}장 업로드 중...`;
        card.appendChild(loadingBox);
      }

      try {
        const uploadPromises = files.map(async (file, i) => {
          const fileName = `Export_${identifier}_${Date.now()}_${i + 1}_${file.name}`;
          const base64Data = await resizeImage(file, 900, 0.6);

          const formData = new URLSearchParams();
          formData.append('action', 'uploadPhoto');
          formData.append('fileName', fileName);
          formData.append('mimeType', 'image/jpeg');
          formData.append('data', base64Data);

          const response = await fetch(webAppUrl, { method: 'POST', body: formData });
          const result = await response.json();
          if (result.status === 'success') return result.url;
          else throw new Error(result.message || '업로드 에러');
        });

        const newUploadedUrls = await Promise.all(uploadPromises);
        if (loadingBox) loadingBox.remove();

        const prefix = isDashboard ? 'dash' : 'row';
        const dbKey = `${prefix}_${rowKeyOrIdx}_photo_${btnIndex}`;
        
        let existingUrls = (exportPhotosMap[dbKey] && exportPhotosMap[dbKey].urls) ? exportPhotosMap[dbKey].urls : [];
        let combinedUrls = existingUrls.concat(newUploadedUrls);

        await exportPhotosRef.child(dbKey).set({ urls: combinedUrls, identifier: identifier });
      } catch (error) {
        if (loadingBox) loadingBox.remove();
        console.error("업로드 실패: ", error);
      }
      inputEl.value = '';
    }

    function renderMobileDashboard(data) {
      const container = document.getElementById('mobile-dashboard-container');
      if (!container) return;
      container.innerHTML = '';

      const keys = Object.keys(data);
      let waitingCount = 0;
      keys.forEach(k => { if (data[k].status === 'WAITING') waitingCount++; });
      document.getElementById('mobile-count-waiting').innerText = waitingCount;
      document.getElementById('mobile-nav-badge').innerText = waitingCount;

      if (keys.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 font-semibold bg-white rounded-2xl p-6 border border-slate-200">등록된 접수 건이 없습니다.</div>`;
        return;
      }

      keys.reverse().forEach(key => {
        const item = data[key];
        const workerList = ["조인효", "윤동현", "이예성", "김찬양"];
        let workerOptions = `<option value="">작업자 선택</option>`;
        workerList.forEach(w => {
          workerOptions += `<option value="${w}" ${item.worker === w ? 'selected' : ''}>${w}</option>`;
        });

        const p1Data = exportPhotosMap[`dash_${key}_photo_1`];
        const p2Data = exportPhotosMap[`dash_${key}_photo_2`];
        const rawPhone = item.phoneNumber || '';
        const telLink = rawPhone ? `tel:${rawPhone.replace(/-/g, '')}` : '#';

        // ★ 상태별 색상 매핑 (접수완료: 빨간색, 작업 중: 노란색, 작업 완료: 파란색)
        const statusVal = item.status || 'WAITING';
        let statusDotColor = 'bg-red-500';
        if (statusVal === 'IN_PROGRESS') statusDotColor = 'bg-amber-400';
        else if (statusVal === 'COMPLETED') statusDotColor = 'bg-blue-600';

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-2">
            <div class="flex items-center gap-2">
              <span class="bg-blue-600 text-white font-black text-[10px] px-2 py-0.5 rounded-md">${item.workType || '하차(입고)'}</span>
              <span class="font-black text-slate-900 text-xs">${item.carNumber || ''}</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">화주명</span><input type="text" value="${item.clientName || ''}" onchange="updateDashboardField('${key}', 'clientName', this.value)" class="w-full bg-white border rounded px-1.5 py-1 text-xs font-bold mt-0.5"></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
              <span class="text-slate-400 block text-[10px]">연락처 (터치시 전화)</span>
              <a href="${telLink}" class="font-bold text-blue-600 underline block mt-0.5">${rawPhone || '-'}</a>
            </div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">수량 / 시간</span><span class="font-bold text-slate-800">${item.quantity || 0} / ${item.timeStr || ''}</span></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">담당자</span><input type="text" value="${item.manager || ''}" onchange="updateDashboardField('${key}', 'manager', this.value)" class="w-full bg-white border rounded px-1.5 py-1 text-xs font-bold mt-0.5"></div>
          </div>

          <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 text-xs">
            <span class="text-slate-400 block text-[10px] mb-0.5">비고</span>
            <input type="text" value="${item.note || ''}" onchange="updateDashboardField('${key}', 'note', this.value)" class="w-full bg-white border rounded px-2 py-1 text-xs font-medium">
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1 items-center">
            <div class="relative flex items-center">
              <!-- ★ 상태 표시 동그라미 인디케이터 -->
              <span class="absolute left-2.5 w-2.5 h-2.5 rounded-full ${statusDotColor}"></span>
              <select onchange="updateDashboardStatus('${key}', this.value)" class="w-full border border-slate-200 bg-white font-bold rounded-xl pl-7 pr-3 py-2 text-xs outline-none cursor-pointer">
                <option value="WAITING" ${statusVal === 'WAITING' ? 'selected' : ''}>접수완료</option>
                <option value="IN_PROGRESS" ${statusVal === 'IN_PROGRESS' ? 'selected' : ''}>작업 중</option>
                <option value="COMPLETED" ${statusVal === 'COMPLETED' ? 'selected' : ''}>작업 완료</option>
              </select>
            </div>
            <select onchange="updateDashboardField('${key}', 'worker', this.value)" class="w-full border border-slate-200 bg-white font-bold rounded-xl px-2.5 py-2 text-xs outline-none cursor-pointer">
              ${workerOptions}
            </select>
          </div>

          <div class="pt-2 border-t border-slate-100 flex gap-2">
            <label class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs text-center cursor-pointer shadow-sm">
              📷 사진 1 업로드 <input type="file" accept="image/*" multiple class="hidden" onchange="handleMobilePhotoUpload(event, 1, '${key}', '${item.carNumber}', true)">
            </label>
            <label class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs text-center cursor-pointer shadow-sm">
              📷 사진 2 업로드 <input type="file" accept="image/*" multiple class="hidden" onchange="handleMobilePhotoUpload(event, 2, '${key}', '${item.carNumber}', true)">
            </label>
          </div>
          <div class="flex gap-2">
            ${p1Data && p1Data.urls && p1Data.urls.length > 0 ? `<button onclick='showPhotoModal(${JSON.stringify(p1Data.urls)}, "${item.carNumber} - 사진 1")' class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold py-1.5 rounded-xl text-xs cursor-pointer">사진 1 보기 (${p1Data.urls.length}장)</button>` : ''}
            ${p2Data && p2Data.urls && p2Data.urls.length > 0 ? `<button onclick='showPhotoModal(${JSON.stringify(p2Data.urls)}, "${item.carNumber} - 사진 2")' class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold py-1.5 rounded-xl text-xs cursor-pointer">사진 2 보기 (${p2Data.urls.length}장)</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function renderMobileExportCards(rows) {
      const container = document.getElementById('mobile-export-container');
      if (!container) return;
      container.innerHTML = '';

      if (rows.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 font-semibold bg-white rounded-2xl p-6 border border-slate-200">데이터가 없습니다.</div>`;
        return;
      }

      rows.forEach((row, idx) => {
        const no = row[0] || (idx + 1);
        const spec = row[1] || '-';
        const cntr = row[2] || 'CNTR 없음';
        const seal = row[3] || '-';
        const client = row[4] || '화주 미정';
        const qty = row[7] || '0';
        const shoring = cleanShoringText(row[12]);
        const note = row[13] || '-';
        const bkNo = row[14] || '-';

        const workerList = ["조인효", "윤동현", "이예성", "김찬양"];
        const savedWorker = exportStatusMap[`row_${idx}_worker`] !== undefined ? exportStatusMap[`row_${idx}_worker`] : (row[34] || '');
        const savedStatus = exportStatusMap[`row_${idx}_status`] !== undefined ? exportStatusMap[`row_${idx}_status`] : (row[33] || 'NONE');

        let workerOptions = `<option value="">작업자 선택</option>`;
        workerList.forEach(w => {
          workerOptions += `<option value="${w}" ${savedWorker === w ? 'selected' : ''}>${w}</option>`;
        });

        const p1Data = exportPhotosMap[`row_${idx}_photo_1`];
        const p2Data = exportPhotosMap[`row_${idx}_photo_2`];

        let shoringDisplayHtml = '';
        if (shoring.toUpperCase() === 'X') {
          shoringDisplayHtml = `<div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs font-bold p-2 rounded-xl text-center">쇼링 X 씰 채결부탁드려요</div>`;
        } else if (savedStatus === 'VANNING') {
          const matchedPhone = getPhoneNumberByShoring(shoring);
          if (matchedPhone) {
            const cleanPhone = matchedPhone.replace(/-/g, '');
            shoringDisplayHtml = `
              <div class="bg-blue-50 border border-blue-200 p-2 rounded-xl text-center flex items-center justify-between">
                <span class="text-xs font-bold text-slate-600">쇼링 (${shoring}) 번호:</span>
                <a href="tel:${cleanPhone}" class="text-xs font-black text-blue-600 underline">${matchedPhone} (터치시 통화)</a>
              </div>
            `;
          }
        }

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
            <div class="flex items-center gap-2">
              <span class="bg-amber-500 text-white font-black text-xs px-2.5 py-1 rounded-lg">No. ${no}</span>
              <span class="font-black text-slate-900 text-sm">${cntr}</span>
            </div>
            <span class="text-xs font-bold text-slate-500">${spec} / ${qty}박스</span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">화주명</span><span class="font-bold text-slate-800">${client}</span></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">SEAL NO.</span><span class="font-bold text-slate-800">${seal}</span></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">쇼링 / B/K</span><span class="font-bold text-slate-800">${shoring} / ${bkNo}</span></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">비고</span><span class="font-bold text-slate-800 truncate block">${note}</span></div>
          </div>

          ${shoringDisplayHtml}

          <div class="grid grid-cols-2 gap-2 pt-1">
            <select onchange="updateExportStatusOrWorker(this, 33, 'status', ${idx})" class="w-full border border-slate-200 bg-white font-bold rounded-lg px-3 py-2 text-xs outline-none">
              <option value="NONE" ${savedStatus === 'NONE' ? 'selected' : ''}>상태: 선택 안함</option>
              <option value="TALLY" ${savedStatus === 'TALLY' ? 'selected' : ''}>TALLY완료</option>
              <option value="VANNING" ${savedStatus === 'VANNING' ? 'selected' : ''}>적입중</option>
              <option value="DONE" ${savedStatus === 'DONE' ? 'selected' : ''}>작업완료</option>
            </select>
            <select onchange="updateExportStatusOrWorker(this, 34, 'worker', ${idx})" class="w-full border border-slate-200 bg-white font-bold rounded-lg px-3 py-2 text-xs outline-none">
              ${workerOptions}
            </select>
          </div>

          <div class="pt-2 border-t border-slate-100 flex gap-2">
            <label class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs text-center cursor-pointer shadow-sm">
              📷 사진 1 업로드 <input type="file" accept="image/*" multiple class="hidden" onchange="handleMobilePhotoUpload(event, 1, ${idx}, '${cntr}')">
            </label>
            <label class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs text-center cursor-pointer shadow-sm">
              📷 사진 2 업로드 <input type="file" accept="image/*" multiple class="hidden" onchange="handleMobilePhotoUpload(event, 2, ${idx}, '${cntr}')">
            </label>
          </div>

          <div class="flex gap-2">
            ${p1Data && p1Data.urls && p1Data.urls.length > 0 ? `<button onclick='showPhotoModal(${JSON.stringify(p1Data.urls)}, "${cntr} - 사진 1")' class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold py-2 rounded-xl text-xs cursor-pointer">사진 1 보기 (${p1Data.urls.length}장)</button>` : ''}
            ${p2Data && p2Data.urls && p2Data.urls.length > 0 ? `<button onclick='showPhotoModal(${JSON.stringify(p2Data.urls)}, "${cntr} - 사진 2")' class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold py-2 rounded-xl text-xs cursor-pointer">사진 2 보기 (${p2Data.urls.length}장)</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function showPhotoModal(urls, titleText) {
      const modal = document.getElementById('photo-viewer-modal');
      const titleEl = document.getElementById('photo-modal-title');
      const listEl = document.getElementById('photo-modal-list');

      titleEl.innerText = `[${titleText}]`;
      listEl.innerHTML = '';

      urls.forEach((url, index) => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between bg-slate-50 border border-slate-200 px-3 py-2.5 rounded-xl text-xs font-bold";
        item.innerHTML = `
          <span class="text-slate-700">사진 #${index + 1}</span>
          <div class="flex gap-2">
            <a href="${url}" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg">크게보기</a>
          </div>
        `;
        listEl.appendChild(item);
      });
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closePhotoModal() {
      document.getElementById('photo-viewer-modal').classList.add('hidden');
    }

    setInterval(() => {
      const savedUrl = localStorage.getItem('sheetWebAppUrl');
      if (savedUrl) fetchSheetData(savedUrl);
    }, 4000);

    window.addEventListener('DOMContentLoaded', () => {
      const lastTab = localStorage.getItem('currentMobileTab') || 'dashboard';
      switchMobileTab(lastTab);

      if ('Notification' in window && Notification.permission === 'default') {
        document.getElementById('notification-permission-banner').classList.remove('hidden');
      }

      const savedUrl = localStorage.getItem('sheetWebAppUrl');
      if (savedUrl) {
        document.getElementById('sheet-url-input').value = savedUrl;
        fetchSheetData(savedUrl);
      } else {
        openSettingsModal();
      }
    });
  </script>
</body>
</html>
