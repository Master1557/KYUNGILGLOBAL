<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경일글로벌 모바일 물류 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Mobile Header -->
  <header class="bg-slate-900 text-white px-4 py-3.5 flex justify-between items-center shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <div class="bg-blue-600 text-white p-1.5 rounded-lg flex items-center justify-center">
        <i data-lucide="truck" class="w-5 h-5"></i>
      </div>
      <span class="text-base font-black tracking-tight">경일글로벌 모바일</span>
    </div>
    
    <!-- 우측 상단 조작 버튼 그룹 -->
    <div class="flex items-center gap-2">
      <span id="sync-status-badge" class="text-[11px] bg-amber-500 text-white px-2.5 py-1 rounded-full font-bold">대기 중</span>
      <button onclick="fetchSheetData(localStorage.getItem('sheetWebAppUrl'))" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow cursor-pointer">
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> 동기화
      </button>
      <button onclick="openSettingsModal()" class="bg-slate-800 hover:bg-slate-700 text-white p-2 rounded-xl transition cursor-pointer" title="환경설정">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Main Content (Cards List) -->
  <main class="max-w-md mx-auto px-3 py-4 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <p class="text-xs font-bold text-slate-400">수출작업 예정 현황</p>
        <h2 class="text-base font-black text-slate-900">현장 작업 카드 목록</h2>
      </div>
      <button onclick="fetchSheetData(localStorage.getItem('sheetWebAppUrl'))" class="bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 shadow cursor-pointer">
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> 새로고침
      </button>
    </div>

    <!-- 렌더링될 카드 목록 컨테이너 -->
    <div id="mobile-card-container" class="space-y-3">
      <div class="text-center py-12 text-slate-400 font-semibold bg-white rounded-2xl p-6 border border-slate-200">
        우측 상단 톱니바퀴(⚙️) 설정 버튼을 눌러 웹 앱 URL을 먼저 입력해주세요.
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-sm p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 text-base">모바일 환경설정</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">구글 Apps Script 웹 앱 URL</label>
        <input type="text" id="sheet-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-blue-500">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeSettingsModal()" class="px-3.5 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold cursor-pointer">취소</button>
        <button onclick="saveSettings()" class="px-3.5 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold cursor-pointer">저장 및 동기화</button>
      </div>
    </div>
  </div>

  <!-- 사진 목록 보기 모달창 -->
  <div id="photo-viewer-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="photo-modal-title" class="font-black text-slate-900 text-base">작업 사진 목록</h3>
        <button onclick="closePhotoModal()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="photo-modal-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-1"></div>
      <div class="flex justify-end pt-2 border-t">
        <button onclick="closePhotoModal()" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl text-xs cursor-pointer">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgXG4dVextcvKD2vwsa11Y7zXPp8rbI08",
      authDomain: "kiglsystem.firebaseapp.com",
      databaseURL: "https://kiglsystem-default-rtdb.firebaseio.com",
      projectId: "kiglsystem",
      storageBucket: "kiglsystem.firebasestorage.app",
      messagingSenderId: "782535308238",
      appId: "1:782535308238:web:afab46d543d96648eb319f",
      measurementId: "G-TTV99051J8"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const exportPhotosRef = database.ref('export_photos');
    const exportStatusRef = database.ref('export_status');

    let exportPhotosMap = {};
    let exportStatusMap = {};
    let lastSheetRows = [];
    let lastRawDataString = "";

    lucide.createIcons();

    exportPhotosRef.on('value', (snapshot) => {
      exportPhotosMap = snapshot.val() || {};
      if (lastSheetRows.length > 0) renderMobileCards(lastSheetRows);
    });

    exportStatusRef.on('value', (snapshot) => {
      exportStatusMap = snapshot.val() || {};
      if (lastSheetRows.length > 0) renderMobileCards(lastSheetRows);
    });

    function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
    function saveSettings() {
      const url = document.getElementById('sheet-url-input').value.trim();
      if (!url) { alert("URL을 입력하세요."); return; }
      localStorage.setItem('sheetWebAppUrl', url);
      closeSettingsModal();
      fetchSheetData(url);
    }

    function fetchSheetData(webAppUrl) {
      if (!webAppUrl) return;
      const badge = document.getElementById('sync-status-badge');
      if (badge) {
        badge.className = "text-[11px] bg-amber-500 text-white px-2.5 py-1 rounded-full font-bold animate-pulse";
        badge.innerText = "동기화 중...";
      }
      const oldScript = document.getElementById('jsonp-script-loader');
      if (oldScript) oldScript.remove();

      window.onSheetDataReceived = function(data) {
        lastSheetRows = data || [];
        const newDataString = JSON.stringify(lastSheetRows);
        if (newDataString !== lastRawDataString) {
          lastRawDataString = newDataString;
          renderMobileCards(lastSheetRows);
        }
        if (badge) {
          badge.className = "text-[11px] bg-emerald-500 text-white px-2.5 py-1 rounded-full font-bold";
          badge.innerText = "연동 완료";
        }
      };

      const script = document.createElement('script');
      script.id = 'jsonp-script-loader';
      script.src = `${webAppUrl}${webAppUrl.includes('?') ? '&' : '?'}callback=onSheetDataReceived&_ts=${Date.now()}`;
      document.body.appendChild(script);
    }

    async function updateExportStatusOrWorker(element, colIndex, fieldName, rowIndex) {
      const webAppUrl = document.getElementById('sheet-url-input').value.trim();
      const value = element.value;

      element.classList.add('bg-yellow-50');
      exportStatusRef.child(`row_${rowIndex}_${fieldName}`).set(value);

      if (webAppUrl) {
        try {
          const formData = new URLSearchParams();
          formData.append('action', 'updateCell');
          formData.append('row', rowIndex);
          formData.append('col', colIndex);
          formData.append('value', value);
          await fetch(webAppUrl, { method: 'POST', body: formData });
        } catch (err) {
          console.error("시트 저장 에러:", err);
        }
      }

      element.classList.remove('bg-yellow-50');
      element.classList.add('bg-emerald-50');
      setTimeout(() => element.classList.remove('bg-emerald-50'), 1000);
    }

    function resizeImage(file, maxWidth = 900, quality = 0.6) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl.split(',')[1]);
          };
        };
      });
    }

    async function handleMobilePhotoUpload(event, btnIndex, rowIndex, identifier) {
      const inputEl = event.target;
      const files = Array.from(inputEl.files);
      if (files.length === 0) return;

      const webAppUrl = document.getElementById('sheet-url-input').value.trim();
      if (!webAppUrl) { alert("환경설정에서 웹 앱 URL을 먼저 입력해주세요."); inputEl.value = ''; return; }

      alert(`${files.length}장의 사진을 업로드합니다. 잠시만 기다려주세요!`);

      try {
        const uploadPromises = files.map(async (file, i) => {
          const fileName = `Export_${identifier}_${Date.now()}_${i + 1}_${file.name}`;
          const base64Data = await resizeImage(file, 900, 0.6);

          const formData = new URLSearchParams();
          formData.append('action', 'uploadPhoto');
          formData.append('fileName', fileName);
          formData.append('mimeType', 'image/jpeg');
          formData.append('data', base64Data);

          const response = await fetch(webAppUrl, { method: 'POST', body: formData });
          const result = await response.json();
          if (result.status === 'success') return result.url;
          else throw new Error(result.message || '업로드 에러');
        });

        const newUploadedUrls = await Promise.all(uploadPromises);
        const dbKey = `row_${rowIndex}_photo_${btnIndex}`;
        let existingUrls = (exportPhotosMap[dbKey] && exportPhotosMap[dbKey].urls) ? exportPhotosMap[dbKey].urls : [];
        let combinedUrls = existingUrls.concat(newUploadedUrls);

        exportPhotosRef.child(dbKey).set({ urls: combinedUrls, identifier: identifier });
        alert("사진 업로드가 완료되었습니다!");
      } catch (error) {
        alert("업로드 실패: " + error.message);
      }
      inputEl.value = '';
    }

    function renderMobileCards(rows) {
      const container = document.getElementById('mobile-card-container');
      if (!container) return;
      container.innerHTML = '';

      if (rows.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 font-semibold bg-white rounded-2xl p-6 border border-slate-200">데이터가 없습니다.</div>`;
        return;
      }

      rows.forEach((row, idx) => {
        const no = row[0] || (idx + 1);
        const spec = row[1] || '-';
        const cntr = row[2] || 'CNTR 없음';
        const seal = row[3] || '-';
        const client = row[4] || '화주 미정';
        const qty = row[7] || '0';
        const shoring = row[11] || '-';
        const note = row[13] || '-';
        const bkNo = row[14] || '-';

        const workerList = ["조인효", "윤동현", "이예성", "김찬양"];
        const savedWorker = exportStatusMap[`row_${idx}_worker`] !== undefined ? exportStatusMap[`row_${idx}_worker`] : (row[33] || '');
        const savedStatus = exportStatusMap[`row_${idx}_status`] !== undefined ? exportStatusMap[`row_${idx}_status`] : (row[32] || 'NONE');

        let workerOptions = `<option value="">작업자 선택</option>`;
        workerList.forEach(w => {
          workerOptions += `<option value="${w}" ${savedWorker === w ? 'selected' : ''}>${w}</option>`;
        });

        const p1Data = exportPhotosMap[`row_${idx}_photo_1`];
        const p2Data = exportPhotosMap[`row_${idx}_photo_2`];

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3";
        
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
            <div class="flex items-center gap-2">
              <span class="bg-blue-600 text-white font-black text-xs px-2.5 py-1 rounded-lg">No. ${no}</span>
              <span class="font-black text-slate-900 text-sm">${cntr}</span>
            </div>
            <span class="text-xs font-bold text-slate-500">${spec} / ${qty}박스</span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">화주명</span><span class="font-bold text-slate-800">${client}</span></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">SEAL NO.</span><span class="font-bold text-slate-800">${seal}</span></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">쇼링 / B/K</span><span class="font-bold text-slate-800">${shoring} / ${bkNo}</span></div>
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="text-slate-400 block text-[10px]">비고</span><span class="font-bold text-slate-800 truncate block">${note}</span></div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <select onchange="updateExportStatusOrWorker(this, 33, 'status', ${idx})" class="w-full border border-slate-200 bg-white font-bold rounded-xl px-3 py-2 text-xs outline-none">
              <option value="NONE" ${savedStatus === 'NONE' ? 'selected' : ''}>상태: 선택 안함</option>
              <option value="TALLY" ${savedStatus === 'TALLY' ? 'selected' : ''}>TALLY완료</option>
              <option value="VANNING" ${savedStatus === 'VANNING' ? 'selected' : ''}>적입중</option>
              <option value="DONE" ${savedStatus === 'DONE' ? 'selected' : ''}>작업완료</option>
            </select>
            <select onchange="updateExportStatusOrWorker(this, 34, 'worker', ${idx})" class="w-full border border-slate-200 bg-white font-bold rounded-xl px-3 py-2 text-xs outline-none">
              ${workerOptions}
            </select>
          </div>

          <div class="pt-2 border-t border-slate-100 flex gap-2">
            <label class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs text-center cursor-pointer shadow-sm">
              📷 사진 1 업로드 <input type="file" accept="image/*" multiple class="hidden" onchange="handleMobilePhotoUpload(event, 1, ${idx}, '${cntr}')">
            </label>
            <label class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs text-center cursor-pointer shadow-sm">
              📷 사진 2 업로드 <input type="file" accept="image/*" multiple class="hidden" onchange="handleMobilePhotoUpload(event, 2, ${idx}, '${cntr}')">
            </label>
          </div>

          <div class="flex gap-2">
            ${p1Data && p1Data.urls && p1Data.urls.length > 0 ? `<button onclick='showPhotoModal(${JSON.stringify(p1Data.urls)}, "${cntr} - 사진 1")' class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold py-2 rounded-xl text-xs cursor-pointer">사진 1 보기 (${p1Data.urls.length}장)</button>` : ''}
            ${p2Data && p2Data.urls && p2Data.urls.length > 0 ? `<button onclick='showPhotoModal(${JSON.stringify(p2Data.urls)}, "${cntr} - 사진 2")' class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold py-2 rounded-xl text-xs cursor-pointer">사진 2 보기 (${p2Data.urls.length}장)</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function showPhotoModal(urls, titleText) {
      const modal = document.getElementById('photo-viewer-modal');
      const titleEl = document.getElementById('photo-modal-title');
      const listEl = document.getElementById('photo-modal-list');

      titleEl.innerText = `[${titleText}]`;
      listEl.innerHTML = '';

      urls.forEach((url, index) => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between bg-slate-50 border border-slate-200 px-3 py-2.5 rounded-xl text-xs font-bold";
        item.innerHTML = `
          <span class="text-slate-700">사진 #${index + 1}</span>
          <div class="flex gap-2">
            <a href="${url}" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg">크게보기</a>
          </div>
        `;
        listEl.appendChild(item);
      });
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closePhotoModal() {
      document.getElementById('photo-viewer-modal').classList.add('hidden');
    }

    setInterval(() => {
      const savedUrl = localStorage.getItem('sheetWebAppUrl');
      if (savedUrl) fetchSheetData(savedUrl);
    }, 4000);

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('sheetWebAppUrl');
      if (savedUrl) {
        document.getElementById('sheet-url-input').value = savedUrl;
        fetchSheetData(savedUrl);
      } else {
        openSettingsModal(); // URL이 없으면 첫 접속 시 설정창 자동 오픈
      }
    });
  </script>
</body>
</html>
